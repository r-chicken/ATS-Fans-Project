name: Build and push webapp image

# Manual only - triggered from the Actions tab ("Run workflow"), not on
# every push. Builds the webapp/Dockerfile image on GitHub's own runners
# (which have Docker built in) and pushes it to Azure Container Registry.
# Exists specifically for environments where neither local Docker Desktop
# nor `az acr build` (ACR Tasks) is available - see webapp/README.md,
# "Option C".
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download trained model from latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p webapp/model
          gh release download \
            --pattern "priority_classifier.joblib" \
            --pattern "priority_classifier.meta.json" \
            --dir webapp/model \
            --clobber

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ats-priority-checker:latest -f webapp/Dockerfile .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ats-priority-checker:latest
